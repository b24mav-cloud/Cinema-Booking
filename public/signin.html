<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | CinemaBooking</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><nav class="nav shell"><a class="brand" href="/"><span class="brand-mark">CB</span><span>CinemaBooking</span></a><a class="text-link" href="/">Back to booking</a></nav></header>
<main class="auth-page shell"><form class="payment-card auth-card" id="signin"><p class="kicker">YOUR ACCOUNT</p><h1>Sign in.</h1><p class="muted">Use your CinemaBooking email and password. Your account type sends you to the right portal automatically.</p><label class="field">Email address<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="error" hidden></p><button class="button gold-button button-full" type="submit">Sign in <span>→</span></button></form></main>
<script>
const form=document.querySelector("#signin"),error=document.querySelector("#error");
form.addEventListener("submit",async event=>{event.preventDefault();error.hidden=true;const result=await fetch("/api/auth/signin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});if(!result.ok){error.textContent=await result.text();error.hidden=false;return}const {user}=await result.json();const next=new URLSearchParams(location.search).get("next");location.href=next||(user.role==="admin"?"/admin.html":"/account.html")});
</script></body></html>
