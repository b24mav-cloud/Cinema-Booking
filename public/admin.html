<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard | CinemaBooking</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><nav class="nav shell"><a class="brand" href="/"><span class="brand-mark">CB</span><span>CinemaBooking Admin</span></a><button class="button" id="signout" type="button">Sign out</button></nav></header>
<main class="admin-page shell"><p class="kicker">ADMIN PORTAL</p><h1>Good evening.</h1><p class="muted">A quick view of the cinema today.</p><section class="admin-stats" id="stats"></section><section class="summary-card admin-placeholder"><p class="kicker">MOVIES</p><div class="section-heading"><h2>Movie records</h2><select id="statusFilter"><option value="">All statuses</option><option>now showing</option><option>coming soon</option><option>archived</option></select></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Title</th><th>Status</th><th>Runtime</th><th></th></tr></thead><tbody id="movies"></tbody></table></div></section></main>
<script>
let movies=[];async function load(){const result=await fetch("/api/admin/dashboard");if(!result.ok){location.href="/signin.html?next=/admin.html";return}const data=await result.json();document.querySelector("#stats").innerHTML=Object.entries({"Now showing":data.moviesCurrentlyShowing,"Upcoming":data.upcomingMovies,"Archived":data.archivedMovies,"Today's bookings":data.todaysBookings}).map(([label,value])=>`<article class="summary-card"><span class="muted">${label}</span><strong>${value}</strong></article>`).join("");const movieResult=await fetch("/api/admin/movies");movies=await movieResult.json();renderMovies()}function renderMovies(){const filter=document.querySelector("#statusFilter").value;document.querySelector("#movies").innerHTML=movies.filter(movie=>!filter||movie.status===filter).map(movie=>`<tr><td>${movie.title}</td><td><span class="vip-badge">${movie.status}</span></td><td>${movie.durationMinutes||"—"} min</td><td>${movie.status==="archived"?"":"<button class='button archive-movie' data-id='"+movie.id+"'>Archive</button>"}</td></tr>`).join("")}document.querySelector("#statusFilter").addEventListener("change",renderMovies);document.addEventListener("click",async event=>{const button=event.target.closest(".archive-movie");if(!button||!confirm("Archive this movie? It will remain available in past receipts."))return;const result=await fetch(`/api/admin/movies/${button.dataset.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"archived"})});if(result.ok){const movie=movies.find(item=>item.id===Number(button.dataset.id));movie.status="archived";renderMovies()}});document.querySelector("#signout").addEventListener("click",async()=>{await fetch("/api/auth/signout",{method:"POST"});location.href="/"});load();
</script></body></html>
